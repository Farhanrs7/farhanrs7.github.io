<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support | MajlisHub</title>
    <meta name="description" content="Get help and support for MajlisHub.">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="assets/MajlisHubLogoSVG.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo-container">
            <img src="assets/MajlisHubLogoSVG.svg" alt="MajlisHub Logo" class="logo-white">
            <span>MajlisHub</span>
        </a>
            <nav class="nav-links">
                <a href="/features">Features</a>
                <a href="/invitations">RSVP</a>
                <a href="/download">Download</a>
                <a href="/privacy">Privacy</a>
            </nav>
    </header>

    <main class="support-section">
        <div class="support-card">
            <div class="support-header">
                <h1>How can we help?</h1>
                <p>Send us a message and our team will get back to you.</p>
            </div>

            <form id="support-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="category">What is this regarding?</label>
                    <select id="category" class="form-control" required>
                        <option value="" disabled selected>Select an option...</option>
                        <option value="bug">Report a Bug / Error</option>
                        <option value="feature_request">Feature Suggestion</option>
                        <option value="vendor_inquiry">Vendor Inquiry</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" class="form-control" placeholder="Please describe the issue or your request in detail..." required></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">Submit Ticket</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="/privacy">Privacy Policy</a>
            <a href="delete-account.html">Delete Account</a>
        </div>
        <p class="footer-copyright">&copy; 2026 MajlisHub. All rights reserved.</p>
    </footer>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <h3>Ticket Submitted! 🎉</h3>
            <p>Thank you for reaching out. We have received your message and will review it shortly.</p>
            <button class="close-btn" id="close-modal-btn">Back to Home</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your exact Firebase config
        const firebaseConfig = {
          apiKey: "AIzaSyDEtHh0CYcAF1F3VufD40dg7RxUgwBD07k",
          authDomain: "wedmadegood.firebaseapp.com",
          projectId: "wedmadegood",
          storageBucket: "wedmadegood.firebasestorage.app",
          messagingSenderId: "557493417789",
          appId: "1:557493417789:web:461094e671d0b355aab754"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Elements
        const form = document.getElementById('support-form');
        const submitBtn = document.getElementById('submit-btn');
        const modal = document.getElementById('successModal');
        const closeModalBtn = document.getElementById('close-modal-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";
        
            const email = document.getElementById('email').value;
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value;
        
            try {
                // Step 1: Save to your Firestore (for your own database records)
                await addDoc(collection(db, "tickets"), {
                    email: email,
                    category: category,
                    description: description,
                    source: "website",
                    status: "open",
                    createdAt: serverTimestamp()
                });
        
                // Step 2: Push to Make.com (to trigger the GitHub Issue)
                // REPLACE THE URL BELOW WITH YOUR COPIED WEBHOOK URL
                await fetch("https://hook.us2.make.com/4xrmd3glm4y2okl4musymjyihaywwg0v", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: email,
                        category: category,
                        description: description,
                        source: "website"
                    })
                });
        
                modal.classList.add('active');
                form.reset();
                
            } catch (error) {
                console.error("Error:", error);
                alert("Something went wrong. Please try again.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Ticket";
            }
        });
        // Modal Close Logic
        closeModalBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            window.location.href = 'index.html'; // Redirect to home
        });
        
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
